<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Handler</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      #log { background:#111; color:#0f0; padding:10px; height:200px; overflow:auto }
      button { margin-right:8px }
      input { margin-right:8px }
    </style>
  </head>
  <body>
    <h1>Device Handler</h1>
    <div>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
      <input id="cmd" placeholder="Command" />
      <button id="send" disabled>Send</button>
    </div>
    <div style="margin-top:12px">Status: <span id="status">disconnected</span></div>
    <pre id="log"></pre>
    <script src="src/renderer.js"></script>
  </body>
</html>
